<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 745" role="img" aria-labelledby="title desc">
  <title id="title">PT 예약 서비스 ERD</title>
  <desc id="desc">이용권 종류와 회원은 구매한 이용권에 연결된다. 트레이너는 수업에, 구매한 이용권은 결제와 예약에, 수업은 예약에 연결된다.</desc>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans CJK KR', sans-serif; fill: #17324d; }
    .title { font-size: 25px; font-weight: 700; }
    .name { font-size: 18px; font-weight: 700; fill: white; }
    .field { font-size: 16px; }
    .link { fill: none; stroke: #52708c; stroke-width: 2.5; }
    .label { font-size: 14px; font-weight: 700; fill: #31516e; }
    .box { fill: white; stroke: #8aa4bd; stroke-width: 2; }
    .head { fill: #24557d; }
  </style>
  <rect width="1000" height="745" fill="#f6f9fc"/>
  <text x="40" y="40" class="title">PT 예약 서비스 ERD · 7개 테이블</text>

  <path class="link" d="M300 165 H335 V390 H370 M500 255 V300 M830 255 V300 M500 480 V525 M630 390 H665 V615 H700 M830 480 V525"/>
  <text x="62" y="286" class="label">종류 1 : 구매 0..N</text>
  <text x="510" y="281" class="label">회원 1 : 구매 0..N</text>
  <text x="839" y="281" class="label">트레이너 1 : 수업 0..N</text>
  <text x="510" y="506" class="label">이용권 1 : 결제 0..1</text>
  <text x="676" y="508" class="label">이용권 1 : 예약 0..N</text>
  <text x="839" y="506" class="label">수업 1 : 예약 0..N</text>

  <g transform="translate(40 75)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">이용권 종류 ticket_type</text>
    <text x="18" y="78" class="field">PK  id</text>
    <text x="18" y="112" class="field">UNIQUE  name</text>
    <text x="18" y="146" class="field">price, total_count</text>
  </g>
  <g transform="translate(370 75)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">회원 member</text>
    <text x="18" y="78" class="field">PK  id</text>
    <text x="18" y="112" class="field">name, phone</text>
    <text x="18" y="146" class="field">birth_day, create_at</text>
  </g>
  <g transform="translate(700 75)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">트레이너 trainer</text>
    <text x="18" y="78" class="field">PK  id</text>
    <text x="18" y="112" class="field">name, phone, birth_day</text>
    <text x="18" y="146" class="field">hire_date, create_at</text>
  </g>
  <g transform="translate(370 300)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">구매한 이용권 ticket</text>
    <text x="18" y="72" class="field">PK  id</text>
    <text x="18" y="98" class="field">FK  member_id</text>
    <text x="18" y="124" class="field">FK  ticket_type_id</text>
    <text x="18" y="150" class="field">price, total_count</text>
    <text x="18" y="175" class="field">remaining_count, 기간</text>
  </g>
  <g transform="translate(700 300)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">수업 class_session</text>
    <text x="18" y="78" class="field">PK  id</text>
    <text x="18" y="112" class="field">FK  trainer_id</text>
    <text x="18" y="146" class="field">시간, 정원, 상태</text>
  </g>
  <g transform="translate(370 525)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">결제 payment</text>
    <text x="18" y="78" class="field">PK  id</text>
    <text x="18" y="112" class="field">FK  ticket_id</text>
    <text x="18" y="146" class="field">UNIQUE(ticket_id), paid_at</text>
  </g>
  <g transform="translate(700 525)">
    <rect class="box" width="260" height="180" rx="8"/><path class="head" d="M8 0 H252 Q260 0 260 8 V42 H0 V8 Q0 0 8 0"/>
    <text x="18" y="29" class="name">예약 reservation</text>
    <text x="18" y="72" class="field">PK  id</text>
    <text x="18" y="103" class="field">FK  class_session_id</text>
    <text x="18" y="134" class="field">FK  ticket_id</text>
    <text x="18" y="165" class="field">status, canceled_at</text>
  </g>
</svg>
